[package]
name = "windows-dynamic-island"
version = "1.1.0"
description = "RN Notch - a Dynamic Island / notch for Windows"
authors = ["RN"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "windows_dynamic_island_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-autostart = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.23"
# CPU and RAM usage. Only the "system" part is needed (no disks, networks, users).
sysinfo = { version = "0.32", default-features = false, features = ["system"] }

# Windows-only APIs. Same version Tauri itself depends on, so only one copy is compiled.
[target.'cfg(windows)'.dependencies]
# For declaring IPolicyConfig (default audio device), which the SDK does not publish.
windows-core = "0.62"
windows = { version = "0.62", features = [
    # Media session (SMTC)
    "Media_Control",
    "Storage_Streams",
    "Foundation",
    # Master volume (Core Audio)
    "Win32_Media_Audio",
    "Win32_Media_Audio_Endpoints",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Variant",
    # Battery
    "Win32_System_Power",
    # Cursor watcher for click-through
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_HiDpi",
    # Mouse button state, to notice a click outside an open menu
    "Win32_UI_Input_KeyboardAndMouse",
    # Monitor bounds, to tell a fullscreen window from a maximized one
    "Win32_Graphics_Gdi",
    # Windows notifications (listener) and the logos of the apps that sent them
    "UI_Notifications",
    "UI_Notifications_Management",
    "ApplicationModel",
    "Foundation_Collections",
    # Wi-Fi and Bluetooth status pop-ups
    "Networking_Connectivity",
    "Devices_Bluetooth",
    "Devices_Enumeration",
    # F1 schedule and results (Jolpica API), driver photos
    "Web_Http",
    "Web_Http_Headers",
    # Clipboard history
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_Ole",
    # App icons, process names for the volume mixer, default audio device
    "Win32_UI_Shell",
    "Win32_Storage_FileSystem",
    "Win32_System_Threading",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_Devices_FunctionDiscovery",
    "Win32_Devices_Properties",
    # Is the session locked? (background loops ease off)
    "Win32_System_RemoteDesktop",
    # Hidden window that receives clipboard, power and display broadcasts
    "Win32_System_LibraryLoader",
] }

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
