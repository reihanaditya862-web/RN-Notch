[package]
name = "windows-dynamic-island"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "windows_dynamic_island_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.23"
# CPU and RAM usage. Only the "system" part is needed (no disks, networks, users).
sysinfo = { version = "0.32", default-features = false, features = ["system"] }

# Windows-only APIs. Same version Tauri itself depends on, so only one copy is compiled.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    # Media session (SMTC)
    "Media_Control",
    "Storage_Streams",
    "Foundation",
    # Master volume (Core Audio)
    "Win32_Media_Audio",
    "Win32_Media_Audio_Endpoints",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Variant",
    # Battery
    "Win32_System_Power",
    # Cursor watcher for click-through
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_HiDpi",
] }

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
